name: Build Android SO

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Build with CMake
      working-directory: MonitorGG
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
        make -j$(nproc)

    - name: Upload SO file
      uses: actions/upload-artifact@v4
      with:
        name: libHookWrite
        path: MonitorGG/build/libHookWrite.so
